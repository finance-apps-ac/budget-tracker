<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget — Annual Tracker</title>
<script>
/* Theme: apply saved choice before paint (no flash), else follow the system. */
(function () {
  var KEY = "theme.pref", root = document.documentElement;
  try { var t = localStorage.getItem(KEY); if (t === "light" || t === "dark") root.setAttribute("data-theme", t); } catch (e) {}
  function cur() { var a = root.getAttribute("data-theme"); return a ? a : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
  function icon() { var b = document.getElementById("themeBtn"); if (b) b.textContent = (cur() === "dark" ? "☀️" : "🌙"); }
  window.__toggleTheme = function () { var n = cur() === "dark" ? "light" : "dark"; root.setAttribute("data-theme", n); try { localStorage.setItem(KEY, n); } catch (e) {} icon(); };
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () { if (!root.getAttribute("data-theme")) icon(); }); } catch (e) {}
  document.addEventListener("DOMContentLoaded", icon);
})();
</script>
<meta name="theme-color" content="#080D1A">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<!-- Cross-device sync: login + cloud storage. Must load before the app script. -->
<script>window.SYNC_CONFIG = { app: "budget", name: "Budget", keys: ["budget.store.v1"] };</script>
<script src="supabase-sync.js?v=17"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input, select { font: inherit; color: inherit; }

  :root {
    --bg: #080D1A; --surface: #0F1728; --surface-2: #172139; --border: #26324E;
    --ink: #EAF2FB; --ink-soft: #94A4BF; --ink-faint: #647294;
    --accent: #2FD3E1; --accent-soft: #0E2C36;
    --gain: #2FE79B; --gain-soft: #0C2A23;
    --loss: #FF5C72; --loss-soft: #2C1622;
    --violet: #9C6BFF;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.42);
    --radius: 14px;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  /* ---------- Light theme (auto = follows system; toggle = manual override) ---------- */
  :root[data-theme="light"] {
    --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EDF1F8; --border:#DCE3EE;
    --ink:#0F1A2E; --ink-soft:#54627C; --ink-faint:#8492AC;
    --accent:#0AA3B2; --accent-soft:#E1F4F6;
    --gain:#0E9C63; --gain-soft:#E4F6EE;
    --loss:#DE344E; --loss-soft:#FCE6EA;
    --violet:#7A4DFF;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 12px 30px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EDF1F8; --border:#DCE3EE;
      --ink:#0F1A2E; --ink-soft:#54627C; --ink-faint:#8492AC;
      --accent:#0AA3B2; --accent-soft:#E1F4F6;
      --gain:#0E9C63; --gain-soft:#E4F6EE;
      --loss:#DE344E; --loss-soft:#FCE6EA;
      --violet:#7A4DFF;
      --shadow:0 1px 2px rgba(16,24,40,.06), 0 12px 30px rgba(16,24,40,.10);
    }
  }
  :root[data-theme="dark"] {
    --bg:#080D1A; --surface:#0F1728; --surface-2:#172139; --border:#26324E;
    --ink:#EAF2FB; --ink-soft:#94A4BF; --ink-faint:#647294;
    --accent:#2FD3E1; --accent-soft:#0E2C36;
    --gain:#2FE79B; --gain-soft:#0C2A23;
    --loss:#FF5C72; --loss-soft:#2C1622;
    --violet:#9C6BFF;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.42);
  }
  .theme-btn { min-width: 38px; justify-content: center; font-size: 15px; line-height: 1; }

  body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .app { max-width: 1120px; margin: 0 auto;
         padding: calc(28px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left)); }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .brand { display: flex; align-items: flex-start; gap: 13px; }
  .mark { width: 36px; height: 36px; border-radius: 9px; flex: none; }
  .mark svg { display: block; width: 100%; height: 100%; }
  .brand h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: 1.6px; text-transform: uppercase; }
  .brand h1 .yr { color: var(--accent); }
  .tagline { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); letter-spacing: .4px; text-transform: uppercase; }
  .topbar-actions { display: flex; align-items: center; gap: 9px; }
  select, .btn { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; color: var(--ink); cursor: pointer; font-size: 13.5px; white-space: nowrap; }
  #yearFilter { font-weight: 700; }
  select:hover, .btn:hover { border-color: var(--accent); }
  .year-input { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; color: var(--ink); font-size: 13.5px; width: 84px; font-variant-numeric: tabular-nums; }
  .year-input:focus, select:focus { border-color: var(--accent); outline: none; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); }
  .tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); font-weight: 600; }
  .tile .value { font-family: var(--font-mono); font-size: 23px; font-weight: 600; margin-top: 7px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .tile .sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .pos { color: var(--gain); } .neg { color: var(--loss); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-top: 18px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .card-head h2 { font-size: 13px; font-weight: 700; margin: 0; letter-spacing: .8px; text-transform: uppercase; color: var(--ink); }
  .card-sub { font-size: 12px; color: var(--ink-faint); }
  .chart svg { display: block; width: 100%; height: auto; }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .axis-text { fill: var(--ink-faint); font-size: 10px; font-family: var(--font-mono); }
  .zero-line { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 3 3; opacity: .55; }
  .bar.gain { fill: var(--gain); } .bar.loss { fill: var(--loss); }

  /* Scroll each table inside its own box so BOTH freeze-panes work in the same scroll area:
     the Category column stays put when scrolling sideways, and the month header row (JAN…DEC)
     stays put when scrolling down through many categories. */
  .grid-wrap { overflow: auto; max-height: 70vh; margin-top: 12px; -webkit-overflow-scrolling: touch;
               scrollbar-width: thin; scrollbar-color: var(--border) transparent; scrollbar-gutter: stable;
               /* When scrolling settles, snap to whole rows (offset past the frozen header/total) so rows
                  never come to rest half-cut at the top or bottom edge. Gentle (proximity), so it never fights you. */
               scroll-snap-type: y proximity; scroll-padding-top: 34px; scroll-padding-bottom: 42px; }
  .grid-wrap tbody tr:not(.total-row) { scroll-snap-align: start; }
  /* Slim, muted scrollbar that sits in its own gutter (no longer overlaps the ✕ column, no longer bright/bulky). */
  .grid-wrap::-webkit-scrollbar { width: 9px; height: 9px; }
  .grid-wrap::-webkit-scrollbar-track { background: transparent; }
  .grid-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; border: 3px solid transparent; background-clip: padding-box; }
  .grid-wrap::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
  .grid-wrap::-webkit-scrollbar-corner { background: transparent; }
  /* Give the ✕ column clearance from the right edge so the (overlay) scrollbar never sits on top of it. */
  .grid-wrap th:last-child, .grid-wrap td:last-child { padding-right: 20px; }
  table { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
  /* Every header cell sticks to the top of the scroll box (frozen month row). */
  th { text-align: right; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); font-weight: 600; padding: 8px 9px; border-bottom: 1px solid var(--border);
       position: sticky; top: 0; z-index: 3; background: var(--surface); }
  th.cat, td.cat { text-align: left; position: sticky; left: 0; background: var(--surface-2); border-right: 1px solid var(--border); z-index: 2; min-width: 150px; }
  /* The corner cell freezes on BOTH axes, so it sits above everything. */
  th.cat { top: 0; left: 0; z-index: 4; background: var(--surface); }
  th.tot, td.tot { border-left: 1px solid var(--border); }
  td { padding: 5px 9px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  tbody tr:hover td { background: var(--surface-2); }
  tbody tr:hover td.cat { background: var(--surface-2); }
  .amt { width: 66px; margin-right: -7px; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; font-size: 12px; font-family: var(--font-mono); text-align: right; color: var(--ink); }
  .amt:hover { border-color: var(--border); }
  .amt:focus { border-color: var(--accent); outline: none; background: var(--surface-2); }
  .amt::placeholder { color: var(--ink-faint); }
  .amt::-webkit-outer-spin-button, .amt::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .amt { -moz-appearance: textfield; appearance: textfield; }
  .catname { width: 132px; margin-left: -7px; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; font-size: 12.5px; color: var(--gain); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  #expenseTable .catname { color: var(--violet); }
  .catname:hover { border-color: var(--border); }
  .catname:focus { border-color: var(--accent); outline: none; background: var(--surface-2); }
  .rowtot { font-family: var(--font-mono); text-align: right; color: var(--ink-soft); }
  /* Pin the Total row to the bottom of the scroll box so the monthly totals stay visible while
     scrolling (mirrors the frozen header on top). Extra bottom padding keeps the numbers clear
     of the horizontal scrollbar. */
  .total-row td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; color: var(--ink);
                  position: sticky; bottom: 0; z-index: 3; background: var(--surface); padding-bottom: 14px; }
  .total-row td.cat { background: var(--surface); left: 0; z-index: 4; }
  .net-row td { font-weight: 700; border-top: 1px solid var(--border); }
  .del { color: var(--ink-faint); cursor: pointer; border: none; background: none; padding: 3px 6px; border-radius: 6px; font-size: 14px; }
  .del:hover { color: var(--loss); background: var(--loss-soft); }
  .addcat { margin-top: 12px; background: none; border: none; color: var(--accent); font-weight: 700; font-size: 12.5px; letter-spacing: .4px; text-transform: uppercase; cursor: pointer; padding: 4px 0; }
  .hint { font-size: 11.5px; color: var(--ink-faint); margin-top: 10px; }
  .foot { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 32px; }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect x=".5" y=".5" width="35" height="35" rx="8.5" fill="#141d33" stroke="#2FD3E1" stroke-opacity=".35"/><g><rect x="8" y="20" width="6" height="8" rx="1.5" fill="#9C6BFF"/><rect x="15" y="14" width="6" height="14" rx="1.5" fill="#2FD3E1"/><rect x="22" y="9" width="6" height="19" rx="1.5" fill="#2FE79B"/></g></svg></span>
      <div>
        <h1><span class="yr">Budget</span></h1>
        <p class="tagline" id="tagline">Annual Tracker</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="themeBtn" class="btn theme-btn" type="button" onclick="__toggleTheme()" title="Light / dark" aria-label="Toggle light or dark theme">🌙</button>
      <select id="yearFilter" aria-label="Budget year"></select>
      <input type="number" id="newYear" class="year-input" placeholder="2027" hidden aria-label="New year">
      <button class="btn" id="addYearBtn" title="Add a year">＋ Year</button>
    </div>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <div class="card-head"><h2>Monthly net (income − expenses)</h2><span class="card-sub" id="netYear"></span></div>
    <div class="chart" id="netChart"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Income</h2><span class="card-sub" id="incomeTotal"></span></div>
    <div class="grid-wrap"><table id="incomeTable"></table></div>
    <button class="addcat" data-add="income">＋ Add income</button>
  </section>

  <section class="card">
    <div class="card-head"><h2>Expenses</h2><span class="card-sub" id="expenseTotal"></span></div>
    <div class="grid-wrap"><table id="expenseTable"></table></div>
    <button class="addcat" data-add="expenses">＋ Add expense</button>
    <p class="hint">Tap any amount to edit. Credit cards &amp; investments are excluded (tracked elsewhere).</p>
  </section>

  <footer class="foot">Private to you — saved in this browser only, never uploaded.</footer>
</div>

<script>
(function () {
  "use strict";
  var SKEY = "budget.store.v1", OLDKEY = "budget.2026.v1";
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var store = loadStore();
  var curYear = latestYear();
  var budget = store[curYear];

  function loadStore() {
    try { var s = JSON.parse(localStorage.getItem(SKEY)); if (s && typeof s === "object" && Object.keys(s).length) return s; } catch (e) {}
    // migrate a single-year save from the earlier version
    try { var old = JSON.parse(localStorage.getItem(OLDKEY)); if (old && old.income) { var m = { "2026": old }; localStorage.setItem(SKEY, JSON.stringify(m)); return m; } } catch (e) {}
    var init = { "2026": seed() }; localStorage.setItem(SKEY, JSON.stringify(init)); return init;
  }
  function years() { return Object.keys(store).sort(); }
  function latestYear() { var y = years(); return y.length ? y[y.length - 1] : "2026"; }
  function persist() { store[curYear] = budget; localStorage.setItem(SKEY, JSON.stringify(store)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Sync hook: after the cloud layer writes new data to storage, re-read it and re-render in
  // place (no page reload — reliable on iOS Safari, which caches reloaded pages).
  window.__resyncApply = function () {
    store = loadStore();
    if (!store[curYear]) curYear = latestYear();
    budget = store[curYear];
    render();
  };

  function row(name, vals) {
    var v = [];
    for (var i = 0; i < 12; i++) v[i] = (vals && vals[i] != null) ? vals[i] : "";
    return { id: uid(), name: name, vals: v };
  }
  // New install: generic starter categories, no amounts. Users fill in their own.
  function seed() {
    return {
      income: [
        row("Salary"),
        row("Side Hustle"),
        row("Other Income")
      ],
      expenses: [
        row("Rent / Mortgage"),
        row("Utilities"),
        row("Phone"),
        row("Groceries"),
        row("Transport / Gas"),
        row("Car Payment"),
        row("Insurance"),
        row("Loan"),
        row("Credit Card"),
        row("Subscriptions"),
        row("Taxes"),
        row("Going Out"),
        row("Shopping"),
        row("Other")
      ]
    };
  }

  var usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  function money(v) { return usd.format(v || 0); }
  function signed(v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + money(Math.abs(v)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" })[c]; }); }
  function num(v) { return (v === "" || v == null) ? 0 : Number(v) || 0; }
  function colTotal(rows, m) { var t = 0; rows.forEach(function (r) { t += num(r.vals[m]); }); return t; }
  function rowTotal(r) { var t = 0; for (var i = 0; i < 12; i++) t += num(r.vals[i]); return t; }
  function sectionTotal(rows) { var t = 0; rows.forEach(function (r) { t += rowTotal(r); }); return t; }

  function render() {
    renderYearSelect();
    document.getElementById("netYear").textContent = curYear;
    document.getElementById("tagline").textContent = curYear + " Annual Budget";
    renderTiles();
    renderChart();
    renderGrid("income", "incomeTable");
    renderGrid("expenses", "expenseTable");
    document.getElementById("incomeTotal").textContent = money(sectionTotal(budget.income)) + " / yr";
    document.getElementById("expenseTotal").textContent = money(sectionTotal(budget.expenses)) + " / yr";
    bindInputs();
    fitGrids();
  }

  // Size each scroll box to hold a WHOLE number of category rows (frozen header + N rows + frozen total),
  // so at rest no row is ever half-cut at the top or bottom edge. Falls back to natural height when
  // everything already fits without scrolling.
  function fitGrids() {
    Array.prototype.forEach.call(document.querySelectorAll(".grid-wrap"), function (wrap) {
      var thead = wrap.querySelector("thead");
      var totalRow = wrap.querySelector(".total-row");
      var bodyRows = wrap.querySelectorAll("tbody tr:not(.total-row)");
      wrap.style.maxHeight = "";                       // reset before measuring
      if (!thead || !totalRow || !bodyRows.length) return;
      var rh = bodyRows[0].getBoundingClientRect().height;
      var hh = thead.getBoundingClientRect().height;
      var th = totalRow.getBoundingClientRect().height;
      if (!rh) return;
      var cap = Math.max(240, Math.round((window.innerHeight || 800) * 0.7));
      var n = Math.floor((cap - hh - th) / rh);
      if (n < 3) n = 3;
      if (n >= bodyRows.length) return;                // all rows fit — leave it natural (no inner scroll)
      wrap.style.maxHeight = (hh + n * rh + th) + "px";
      wrap.style.scrollPaddingTop = hh + "px";         // snap rows exactly below the frozen header
      wrap.style.scrollPaddingBottom = th + "px";      // and exactly above the frozen total
    });
  }
  // Re-fit when the viewport size changes (rotate, resize, split view).
  window.addEventListener("resize", function () { fitGrids(); });

  function renderTiles() {
    var inc = sectionTotal(budget.income), exp = sectionTotal(budget.expenses), net = inc - exp;
    var rate = inc ? (net / inc * 100) : 0;
    var months = 0, netSum = 0;
    for (var m = 0; m < 12; m++) { var n = colTotal(budget.income, m) - colTotal(budget.expenses, m); if (colTotal(budget.income, m) || colTotal(budget.expenses, m)) { months++; netSum += n; } }
    var tiles = [
      { label: "Income", value: money(inc), cls: "pos", sub: "12-mo total" },
      { label: "Expenses", value: money(exp), cls: "", sub: "excl. cards + investing" },
      { label: "Net savings", value: signed(net), cls: net >= 0 ? "pos" : "neg", sub: "income − expenses" },
      { label: "Savings rate", value: (inc ? rate.toFixed(0) + "%" : "—"), cls: net >= 0 ? "pos" : "neg", sub: "of income kept" },
      { label: "Avg / month", value: signed(months ? Math.round(netSum / months) : 0), cls: netSum >= 0 ? "pos" : "neg", sub: months + " active months" }
    ];
    document.getElementById("tiles").innerHTML = tiles.map(function (t) {
      return '<div class="tile"><div class="label">' + t.label + '</div><div class="value ' + t.cls + '">' + t.value + '</div><div class="sub">' + t.sub + '</div></div>';
    }).join("");
  }

  function renderChart() {
    var host = document.getElementById("netChart");
    var vals = [];
    for (var m = 0; m < 12; m++) vals.push(colTotal(budget.income, m) - colTotal(budget.expenses, m));
    var W = 720, H = 220, padL = 46, padR = 12, padT = 12, padB = 30;
    var min = Math.min(0, Math.min.apply(null, vals)), max = Math.max(0, Math.max.apply(null, vals));
    if (min === max) max = min + 1;
    var y = function (v) { return padT + (1 - (v - min) / (max - min)) * (H - padT - padB); };
    var bw = (W - padL - padR) / 12, zeroY = y(0);
    var bars = vals.map(function (v, i) {
      var bx = padL + i * bw + bw * 0.18, w = bw * 0.64;
      var top = v >= 0 ? y(v) : zeroY, h = Math.abs(y(v) - zeroY);
      return '<rect class="bar ' + (v >= 0 ? "gain" : "loss") + '" x="' + bx.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="2"/>' +
             '<text class="axis-text" x="' + (bx + w / 2).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + MON[i] + '</text>';
    }).join("");
    var grid = "";
    for (var g = 0; g <= 3; g++) { var val = min + (max - min) * g / 3, gy = y(val).toFixed(1); grid += '<line class="grid-line" x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '"/><text class="axis-text" x="' + (padL - 7) + '" y="' + gy + '" text-anchor="end" dominant-baseline="middle">' + money(val) + '</text>'; }
    host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Monthly net savings">' + grid + '<line class="zero-line" x1="' + padL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + zeroY.toFixed(1) + '"/>' + bars + '</svg>';
  }

  function headRow() {
    var h = '<thead><tr><th class="cat">Category</th>';
    for (var m = 0; m < 12; m++) h += '<th>' + MON[m] + '</th>';
    return h + '<th class="tot">Total</th><th></th></tr></thead>';
  }

  function renderGrid(sec, tableId) {
    var rows = budget[sec];
    var body = "";
    rows.forEach(function (r) {
      body += '<tr><td class="cat"><input class="catname" data-sec="' + sec + '" data-id="' + r.id + '" data-field="name" value="' + esc(r.name) + '"></td>';
      for (var m = 0; m < 12; m++) {
        body += '<td><input class="amt" type="number" step="any" inputmode="decimal" data-sec="' + sec + '" data-id="' + r.id + '" data-mo="' + m + '" value="' + (r.vals[m] === "" || r.vals[m] == null ? "" : esc(r.vals[m])) + '" placeholder="—"></td>';
      }
      body += '<td class="tot rowtot">' + money(rowTotal(r)) + '</td><td><button class="del" title="Delete" data-del="' + sec + '" data-id="' + r.id + '">✕</button></td></tr>';
    });
    // totals row
    var tr = '<tr class="total-row"><td class="cat">Total</td>';
    for (var m2 = 0; m2 < 12; m2++) tr += '<td class="rowtot">' + money(colTotal(rows, m2)) + '</td>';
    tr += '<td class="tot rowtot">' + money(sectionTotal(rows)) + '</td><td></td></tr>';
    document.getElementById(tableId).innerHTML = headRow() + '<tbody>' + body + tr + '</tbody>';
  }

  function findRow(sec, id) { return budget[sec].filter(function (r) { return r.id === id; })[0]; }

  function bindInputs() {
    Array.prototype.forEach.call(document.querySelectorAll(".amt"), function (inp) {
      inp.addEventListener("change", function () {
        var r = findRow(inp.getAttribute("data-sec"), inp.getAttribute("data-id"));
        if (r) { r.vals[+inp.getAttribute("data-mo")] = inp.value === "" ? "" : parseFloat(inp.value); persist(); render(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".catname"), function (inp) {
      inp.addEventListener("change", function () {
        var r = findRow(inp.getAttribute("data-sec"), inp.getAttribute("data-id"));
        if (r) { r.name = inp.value; persist(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        var sec = b.getAttribute("data-del"), id = b.getAttribute("data-id");
        budget[sec] = budget[sec].filter(function (r) { return r.id !== id; });
        persist(); render();
      });
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-add]"), function (b) {
    b.addEventListener("click", function () {
      var sec = b.getAttribute("data-add");
      budget[sec].push(row(sec === "income" ? "New income" : "New expense", []));
      persist(); render();
    });
  });

  // ---------- years ----------
  function renderYearSelect() {
    var sel = document.getElementById("yearFilter");
    var ys = years().slice().reverse();  // newest first
    sel.innerHTML = ys.map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join("");
    sel.value = curYear;
  }
  function addYear(y) {
    y = String(y);
    if (!store[y]) {
      // new year keeps your categories but starts with blank amounts
      var src = store[latestYear()] || { income: [], expenses: [] };
      store[y] = {
        income: src.income.map(function (r) { return row(r.name, []); }),
        expenses: src.expenses.map(function (r) { return row(r.name, []); })
      };
      localStorage.setItem(SKEY, JSON.stringify(store));
    }
    curYear = y; budget = store[y]; render();
  }
  document.getElementById("yearFilter").addEventListener("change", function () {
    curYear = this.value; budget = store[curYear]; render();
  });
  var newYearInput = document.getElementById("newYear");
  document.getElementById("addYearBtn").addEventListener("click", function () {
    if (newYearInput.hidden) { newYearInput.hidden = false; newYearInput.value = ""; newYearInput.focus(); }
    else commitYear();
  });
  newYearInput.addEventListener("keydown", function (e) { if (e.key === "Enter") commitYear(); });
  function commitYear() {
    var y = String(newYearInput.value || "").trim();
    if (!/^\d{4}$/.test(y)) { newYearInput.focus(); return; }
    newYearInput.hidden = true; addYear(y);
  }

  render();
})();
</script>
